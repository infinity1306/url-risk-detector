version: '3.8'

services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: threat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: url-threat-intel
    networks:
      - threat-net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: threat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - threat-net

  # Backend API
  backend:
    build: ./backend
    container_name: threat-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/url-threat-intel
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - SCAN_TIMEOUT_MS=15000
    depends_on:
      - mongo
      - redis
    networks:
      - threat-net

  # Frontend (Nginx)
  frontend:
    build: ./frontend
    container_name: threat-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - threat-net

volumes:
  mongo-data:
  redis-data:


networks:
  threat-net:
    driver: bridge
